{% if requests %}
<div class="bg-white border border-slate-200 rounded-2xl overflow-hidden" style="box-shadow: var(--lift)">
    {% for r in requests %}
    <a href="{% url 'portal:detail' r.pk %}" class="flex items-center justify-between gap-3 px-4 py-3 border-b border-slate-100 last:border-0 no-underline hover:bg-slate-50">
        <div>
            <div class="font-semibold text-slate-800">{{ r.service_type.name }} <span class="text-xs text-slate-400">{{ r.reference }}</span></div>
            <div class="text-xs text-slate-500">{{ r.created_at|date:"Y-m-d H:i" }}</div>
        </div>
        <span class="badge">{{ r.get_status_display }}</span>
    </a>
    {% endfor %}
</div>
{% else %}
<p class="text-slate-500">لا توجد طلبات بعد.</p>
{% endif %}

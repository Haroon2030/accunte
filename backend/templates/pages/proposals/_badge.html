<span class="px-2 py-0.5 rounded-full text-xs font-medium whitespace-nowrap
{% if status == 'draft' %}bg-slate-100 text-slate-700
{% elif status == 'submitted' %}bg-indigo-100 text-indigo-700
{% elif status == 'pending_review' %}bg-purple-100 text-purple-700
{% elif status == 'needs_info' %}bg-yellow-100 text-yellow-800
{% elif status == 'approved' %}bg-green-100 text-green-700
{% elif status == 'rejected' %}bg-red-100 text-red-700
{% elif status == 'dispatched' %}bg-blue-100 text-blue-700
{% elif status == 'confirmed_paid' %}bg-emerald-100 text-emerald-800
{% else %}bg-slate-200 text-slate-500{% endif %}">{{ label }}</span>

{% extends "base.html" %}

{% block title %}{{ page_title }} - نظام مطابقة الموردين{% endblock %}
{% block page_title %}{{ page_title }}{% endblock %}

{% block content %}
<div id="tasks-board" data-url="{% url 'servicedesk:my_tasks' %}?partial=1">
    {% include "pages/servicedesk/_tasks_board.html" %}
</div>
<div id="mt-toast" class="mt-toast" role="status" hidden>
    <i data-lucide="bell-ring"></i> <b>وصلتك مهمة جديدة</b>
</div>

<style>
    .mt-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem; margin-bottom: 1rem; }
    @media (max-width: 760px) { .mt-stats { grid-template-columns: 1fr 1fr; } }
    .mt-stat { background: #fff; border: 1px solid var(--card-line); border-radius: 1rem; padding: 0.9rem 1.1rem; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(16, 37, 47, 0.05); border-top: 3px solid #c9d5db; }
    .mt-stat span { font-size: 0.78rem; font-weight: 600; color: var(--ink-3); }
    .mt-stat b { font-size: 2rem; font-weight: 800; line-height: 1.15; color: var(--ink); font-variant-numeric: tabular-nums; }
    .mt-stat.is-new { border-top-color: #2f74f0; } .mt-stat.is-new b { color: #1f5fd6; }
    .mt-stat.is-work { border-top-color: #d99a06; } .mt-stat.is-work b { color: #8a5a00; }
    .mt-stat.is-late { border-top-color: #dc2626; background: #fff5f4; } .mt-stat.is-late b { color: #b42318; }
    .mt-stat.is-done { border-top-color: #16a34a; } .mt-stat.is-done b { color: #15803d; }

    .mt-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; align-items: start; }
    @media (max-width: 1000px) { .mt-cols { grid-template-columns: 1fr; } }
    .mt-col { background: #eaf0f8; border-radius: 1.1rem; padding: 0.9rem; display: grid; gap: 0.7rem; }
    .mt-col h3 { display: flex; align-items: center; gap: 0.5rem; font-size: 0.95rem; font-weight: 800; color: var(--ink); padding: 0.1rem 0.3rem; }
    .mt-col h3 svg { width: 1.1rem; height: 1.1rem; color: #1f5fd6; }
    .mt-col h3 em { margin-inline-start: auto; font-style: normal; font-size: 0.75rem; background: #fff; border-radius: 999px; padding: 0.05rem 0.6rem; color: var(--ink-2); }
    .mt-card { background: #fff; border: 1px solid #dbe5f3; border-radius: 0.9rem; padding: 0.85rem 1rem; display: grid; gap: 0.3rem; box-shadow: 0 1px 2px rgba(16, 37, 47, 0.05); transition: box-shadow 0.15s ease, transform 0.15s ease; }
    .mt-card:hover { box-shadow: 0 10px 22px -14px rgba(31, 95, 214, 0.5); transform: translateY(-2px); }
    .mt-card.is-late { border-color: #f3b8b2; border-inline-start: 4px solid #dc2626; }
    .mt-card.is-done { opacity: 0.85; }
    .mt-card header { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .mt-ref { font-family: ui-monospace, monospace; font-size: 0.75rem; font-weight: 700; color: var(--ink-2); background: #eef2f6; padding: 0.1rem 0.5rem; border-radius: 0.4rem; }
    .mt-due { font-size: 0.74rem; font-weight: 700; }
    .mt-due.is-late { color: #b42318; } .mt-due.is-soon { color: #b4470c; } .mt-due.is-ok { color: var(--ink-3); }
    .mt-card h4 { font-size: 1rem; font-weight: 800; color: var(--ink); }
    .mt-supplier { font-size: 0.85rem; font-weight: 600; color: var(--ink-2); }
    .mt-subject { font-size: 0.8rem; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mt-tag { font-size: 0.68rem; font-weight: 700; padding: 0.05rem 0.5rem; border-radius: 999px; background: #fdf0c6; color: #8a5a00; margin-inline-start: 0.3rem; }
    .mt-tag.is-red { background: #fde3e1; color: #b42318; }
    .mt-card footer { display: flex; gap: 0.5rem; margin-top: 0.35rem; }
    .mt-card footer form { margin: 0; }
    .mt-empty { font-size: 0.82rem; color: var(--ink-3); text-align: center; padding: 1.2rem 0.5rem; }
    .mt-toast { position: fixed; bottom: 3rem; inset-inline-start: 1.25rem; z-index: 90; display: flex; align-items: center; gap: 0.6rem; background: #1f5fd6; color: #fff; padding: 0.8rem 1.2rem; border-radius: 0.9rem; box-shadow: 0 14px 30px -12px rgba(31, 95, 214, 0.7); animation: mt-in 0.3s ease-out; }
    .mt-toast[hidden] { display: none; }
    .mt-toast svg { width: 1.2rem; height: 1.2rem; }
    @keyframes mt-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .mt-card, .mt-toast { transition: none; animation: none; } }
</style>
<script>
(function () {
    'use strict';
    /* تحديث حيّ كل 15 ثانية: تظهر المهام الجديدة دون إعادة تحميل، مع تنبيه عند وصول مهمة */
    var board = document.getElementById('tasks-board'), toast = document.getElementById('mt-toast');
    var meta = function () { var m = board.querySelector('[data-meta]'); return m ? parseInt(m.dataset.new, 10) : 0; };
    var known = meta(), failures = 0, timer = null;
    function poll() {
        fetch(board.dataset.url, { credentials: 'same-origin', cache: 'no-store' })
            .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
            .then(function (html) {
                failures = 0;
                var box = document.createElement('div'); box.innerHTML = html;
                var m = box.querySelector('[data-meta]'), now = m ? parseInt(m.dataset.new, 10) : known;
                if (box.innerHTML !== board.innerHTML) {
                    board.innerHTML = html;
                    if (window.lucide) lucide.createIcons();
                }
                if (now > known && toast) { toast.hidden = false; setTimeout(function () { toast.hidden = true; }, 6000); }
                known = now;
            })
            .catch(function () { failures += 1; })
            .then(schedule);
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(poll, document.hidden ? 60000 : Math.min(120000, 15000 * (1 + failures))); }
    document.addEventListener('visibilitychange', function () { if (!document.hidden) { clearTimeout(timer); poll(); } });
    schedule();
})();
</script>
{% endblock %}

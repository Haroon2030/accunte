{% extends "base.html" %}

{% block title %}{{ page_title }} - نظام المدفوعات{% endblock %}
{% block page_title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="space-y-4">
    <form method="get" class="bg-white rounded-xl shadow-sm border border-slate-200 p-3 flex flex-wrap items-center gap-3">
        <input type="hidden" name="tab" value="{{ tab }}">
        <input name="q" value="{{ q }}" placeholder="بحث بالاسم أو الرقم أو المورد..." class="flex-1 min-w-[200px] px-3 py-2 border border-slate-200 rounded-lg text-sm">
        <label class="flex items-center gap-2 text-sm text-slate-600"><input type="checkbox" name="late" value="1" {% if late %}checked{% endif %} onchange="this.form.submit()"> متأخرة الرد (&gt; {{ sla_minutes }} د)</label>
        <button class="btn btn-primary btn-sm"><i data-lucide="search"></i> بحث</button>
    </form>

    <div id="inbox-list" data-live-url="{% url 'whatsapp_inbox:live' %}" data-sig="{{ sig }}">
        {% include "pages/whatsapp/_inbox_list.html" %}
    </div>
</div>
<script>
(function () {
    'use strict';
    var box = document.getElementById('inbox-list'), sig = box.dataset.sig, failures = 0, timer = null;
    function poll() {
        var qs = new URLSearchParams(location.search); qs.set('sig', sig);
        fetch(box.dataset.liveUrl + '?' + qs.toString(), { credentials: 'same-origin', cache: 'no-store', headers: { Accept: 'application/json' } })
            .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(function (d) {
                failures = 0;
                if (d.changed) { sig = d.sig; box.innerHTML = d.html; if (window.lucide) lucide.createIcons(); }
            })
            .catch(function () { failures += 1; })
            .then(schedule);
    }
    function schedule() {
        clearTimeout(timer);
        var delay = document.hidden ? 10000 : 2500;
        if (failures) delay = Math.min(20000, delay * (1 + failures));
        timer = setTimeout(poll, delay);
    }
    document.addEventListener('visibilitychange', function () { if (!document.hidden) { clearTimeout(timer); poll(); } });
    schedule();
})();
</script>
{% endblock %}
